services:
  postgres:
    image: postgres:16-alpine
    container_name: auto-router-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-jev_router}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-jev_router}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - auto-router
      - hermes-net

  redis:
    image: redis:7-alpine
    container_name: auto-router-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - auto-router
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  router:
    build:
      context: .
    container_name: auto-router
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-jev_router}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./config:/app/config
    networks:
      - auto-router
      - hermes-net
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

volumes:
  postgres-data:
  redis-data:

networks:
  auto-router:
    name: auto-router
  hermes-net:
    external: true
    name: hermes-stack_hermes-net